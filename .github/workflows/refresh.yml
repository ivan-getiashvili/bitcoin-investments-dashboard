name: Refresh on-chain data

# The on-chain metrics (MVRV, realized cap, exchange balances) are published once
# a day by the vendor, so once a day is genuinely as often as this can usefully
# run. Price, funding and open interest never come through here — the page polls
# Binance directly, every 15 seconds, in the visitor's browser.
#
# GitHub's scheduler is best-effort: this can fire 5-30 minutes late and is
# occasionally skipped under load. Fine for daily data; it would not be fine for
# anything time-critical.
on:
  schedule:
    - cron: '25 1 * * *'      # 01:25 UTC — off the hour, where the queue is shortest
  push:
    branches: [main]
  workflow_dispatch: {}        # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data and build the site
        run: npm run build:site

      - name: Check the build produced a real page
        run: |
          test -s _site/index.html || { echo "index.html missing or empty"; exit 1; }
          grep -q 'Bitcoin Cycle Position' _site/index.html || { echo "page content missing"; exit 1; }
          echo "index.html: $(wc -c < _site/index.html) bytes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Vercel rebuilds on every push by itself, but a scheduled run makes no commit,
  # so nudge it. Optional: skipped entirely unless the secret is set.
  ping-vercel:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — skipping (GitHub Pages still deployed)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Vercel rebuild triggered."
