name: Refresh and deploy

# The on-chain metrics (MVRV, realized cap, exchange balances) are published once
# a day by the vendor, so once a day is genuinely as often as this can usefully
# run. Price, funding and open interest never come through here — the page polls
# Binance directly, every 15 seconds, in the visitor's browser.
#
# GitHub's scheduler is best-effort: this can fire 5-30 minutes late and is
# occasionally skipped under load. Fine for daily data; it would not be fine for
# anything time-critical.
on:
  schedule:
    - cron: '25 1 * * *'      # 01:25 UTC — off the hour, where the queue is shortest
  push:
    branches: [main]
  workflow_dispatch: {}        # run it by hand from the Actions tab

permissions:
  contents: write              # to push the built site to the deploy branch
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # jsdom, which runs the page at build time so the published HTML already
      # contains every reading (see scripts/prerender.ts).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Ends with scripts/verify-site.ts, which reads _site/ the way a crawler or
      # an AI assistant does — no JavaScript — and fails the run if the readings
      # are not in the HTML, or if llms.txt, summary.json and the page disagree.
      - name: Fetch data, build, prerender and verify the site
        run: npm run build:site

      # A failed fetch must never publish a blank page over a working one.
      # Check structure, never copy. An earlier version grepped for the page's
      # headline text and blocked the deploy the day that headline was reworded
      # — a guard that fails on an intended edit trains you to ignore it.
      - name: Verify the build produced a real page
        run: |
          test -s _site/index.html || { echo "index.html missing or empty"; exit 1; }
          bytes=$(wc -c < _site/index.html)
          [ "$bytes" -gt 100000 ] || { echo "index.html is only $bytes bytes - data did not bake in"; exit 1; }
          grep -q '<title>' _site/index.html || { echo "no <title> - template did not render"; exit 1; }
          grep -q 'const DATA = {' _site/index.html || { echo "no data blob baked into the page"; exit 1; }
          grep -q '"mvrv"' _site/index.html || { echo "metric series missing from the payload"; exit 1; }
          test -s _site/live.json || { echo "live.json missing"; exit 1; }
          for f in robots.txt sitemap.xml llms.txt llms-full.txt index.md summary.json 404.html; do
            test -s "_site/$f" || { echo "$f missing"; exit 1; }
          done
          echo "index.html: $bytes bytes - structure checks passed"

      # Hostinger's Git integration serves the repo contents verbatim — it runs
      # no build. So we publish the BUILT site to its own branch, whose root is
      # exactly what should sit in public_html. main stays clean source.
      - name: Publish built site to the deploy branch
        run: |
          cd _site
          git init -q
          git checkout -qb deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy
          echo "Pushed to deploy branch — Hostinger pulls this automatically."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Handed to the `record` job below, which needs nothing else from this build.
      - uses: actions/upload-artifact@v4
        with:
          name: site-summary
          path: _site/summary.json
          retention-days: 1

  # Secondary URL, straight off the repo. Hostinger + the custom domain is the
  # one to share; this one is a free backup that costs nothing to keep.
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare — the host behind btcmetrics.online — rebuilds only when main
  # receives a push. Without this job the canonical site kept whatever data it
  # had at the last code change, while this workflow quietly refreshed the mirror
  # every morning: five days without a commit meant five-day-old numbers on the
  # address people are actually given.
  #
  # So the scheduled run appends the day's reading to a public log and commits
  # it. That push is what makes Cloudflare rebuild, with fresh data of its own.
  # The log is worth having anyway: a dated, append-only record in git history of
  # what the site said each day, which nobody can rewrite with hindsight.
  #
  # A job of its own so that a failed push is loud (the run goes red) without
  # holding back the Pages deploy. Pushes made with GITHUB_TOKEN do not start
  # workflows, so this cannot loop.
  record:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: site-summary
          path: _site

      - name: Record the daily reading (this push is what refreshes Cloudflare)
        run: |
          node --experimental-strip-types scripts/record-reading.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/daily-readings.csv
          if git diff --cached --quiet; then
            echo "No new on-chain day since the last record; nothing to commit."
          else
            git commit -qm "Daily reading $(tail -n 1 records/daily-readings.csv | cut -d, -f1)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            echo "Pushed; Cloudflare will rebuild btcmetrics.online from main."
          fi
