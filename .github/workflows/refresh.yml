name: Refresh and deploy

# The on-chain metrics (MVRV, realized cap, exchange balances) are published once
# a day by the vendor, so once a day is genuinely as often as this can usefully
# run. Price, funding and open interest never come through here — the page polls
# Binance directly, every 15 seconds, in the visitor's browser.
#
# GitHub's scheduler is best-effort: this can fire 5-30 minutes late and is
# occasionally skipped under load. Fine for daily data; it would not be fine for
# anything time-critical.
on:
  schedule:
    - cron: '25 1 * * *'      # 01:25 UTC — off the hour, where the queue is shortest
  push:
    branches: [main]
  workflow_dispatch: {}        # run it by hand from the Actions tab

permissions:
  contents: write              # to push the built site to the deploy branch
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data and build the site
        run: npm run build:site

      # A failed fetch must never publish a blank page over a working one.
      - name: Verify the build produced a real page
        run: |
          test -s _site/index.html || { echo "index.html missing or empty"; exit 1; }
          grep -q 'Bitcoin Cycle Position' _site/index.html || { echo "page title missing"; exit 1; }
          grep -q '"CapMVRVCur"\|"mvrv"' _site/index.html || { echo "no metric data baked in"; exit 1; }
          echo "index.html: $(wc -c < _site/index.html) bytes"

      # Hostinger's Git integration serves the repo contents verbatim — it runs
      # no build. So we publish the BUILT site to its own branch, whose root is
      # exactly what should sit in public_html. main stays clean source.
      - name: Publish built site to the deploy branch
        run: |
          cd _site
          git init -q
          git checkout -qb deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy
          echo "Pushed to deploy branch — Hostinger pulls this automatically."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Secondary URL, straight off the repo. Hostinger + the custom domain is the
  # one to share; this one is a free backup that costs nothing to keep.
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
